dataset: PRJEB80229
sample: HEK293T_directRNA
cell_line: HEK293T
chemistry: RNA004

paths:
  project_dir: /gpfs/work/bio/zhikefu24/surf/PRJEB80229
  raw_data_dir: /gpfs/work/bio/zhikefu24/surf/PRJEB80229/raw_data
  pod5_dir: /gpfs/work/bio/zhikefu24/surf/PRJEB80229/raw_data/HEK293T_directRNA
  dorado_dir: /gpfs/work/bio/zhikefu24/surf/PRJEB80229/dorado
  bam: /gpfs/work/bio/zhikefu24/surf/PRJEB80229/dorado/PRJEB80229_dorado_m6A.primary.sorted.bam
  deeprm_dir: /gpfs/work/bio/zhikefu24/surf/PRJEB80229/deeprm
  deeprm_prep_dir: /gpfs/work/bio/zhikefu24/surf/PRJEB80229/deeprm/prep

deeprm_call_prep:
  script: scripts/deeprm/deeprm_01_call_prep.sh
  threads: 4
  memory: 128G
  partition: cpu8358
  qos: 26cores
  pod5_input_type: directory
  command_template: >
    deeprm call prep
    -p <pod5_dir>
    -b <bam>
    -o <deeprm_prep_dir>
    -t 4

notes:
  bam_filtering: secondary and supplementary alignments removed
  pod5_note: DeepRM call prep expects a POD5 directory, not a single .pod5 file
  runtime_library_note: libssl.so.10 and libcrypto.so.10 are required for DeepRM C++ preprocessing
