name: deeprm_env
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Core language
  - python=3.10
  - pip

  # Basic Python packages
  - numpy
  - pandas
  - scipy
  - h5py
  - tqdm
  - pyyaml

  # Bioinformatics and nanopore-related packages/tools
  - pysam
  - pod5
  - samtools
  - minimap2

  # Python packages installed by pip
  - pip:
      - deeprm
      - ont-fast5-api
