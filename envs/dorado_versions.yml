dorado:
  installed_separately: true
  version: "0.7.3"
  model: "rna004_130bps_sup@v5.0.0"
  notes:
    - Dorado is used for RNA004 basecalling and modified-base calling.
    - Use --emit-moves if the BAM will also be used by DeepRM.
    - Large model files and Dorado binaries are not stored in this repository.

modkit:
  installed_separately: true
  version: "v0.6.1"
  notes:
    - Used to convert Dorado modBAM output into site-level bedMethyl files.

samtools:
  installed_by: dorado_env.yml
  purpose:
    - BAM sorting
    - BAM indexing
    - filtering secondary and supplementary alignments

minimap2:
  installed_by: dorado_env.yml
  purpose:
    - splice-aware alignment of direct RNA reads

pipeline_outputs:
  modbam: "Dorado modified-base BAM with MM/ML tags"
  primary_bam: "BAM after removing secondary and supplementary alignments"
  bedmethyl: "site-level bedMethyl generated by modkit pileup"
  tsv: "cleaned site-level table for benchmark comparison"
