hpc: XJTLU_HPC

slurm:
  cpu_partition: cpu8358
  cpu_qos: 26cores
  gpu_partition: gpua800
  gpu_qos: 1a800

runtime:
  use_conda_activate: false
  call_tools_by_absolute_path: true

executables:
  deeprm: /gpfs/work/bio/zhikefu24/deeprm/envs/deeprm/bin/deeprm
  python: /gpfs/work/bio/zhikefu24/deeprm/envs/deeprm/bin/python
  samtools: /gpfs/work/bio/zhikefu24/deeprm/envs/samtools/bin/samtools
  modkit: /gpfs/work/bio/zhikefu24/deeprm/software/modkit/unpack/dist_modkit_v0.6.1_481e3c9/modkit

libraries:
  openssl10_libdir: /gpfs/spack/opt/linux-rocky8-icelake/gcc-13.1.0/cuda-12.6.0-65s2yveepqjf756guqpn6tedu7avyzda/nsight-systems-2024.4.2/target-linux-x64/CollectX

environment_variables:
  LD_LIBRARY_PATH:
    - /gpfs/spack/opt/linux-rocky8-icelake/gcc-13.1.0/cuda-12.6.0-65s2yveepqjf756guqpn6tedu7avyzda/nsight-systems-2024.4.2/target-linux-x64/CollectX
  OMP_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  NUMEXPR_NUM_THREADS: 1
  VEC_LIB_MAXIMUM_THREADS: 1

notes:
  - DeepRM C++ preprocessing requires libssl.so.10 and libcrypto.so.10.
  - On XJTLU HPC, these libraries were resolved by adding the nsight-systems CollectX directory to LD_LIBRARY_PATH.
  - DeepRM call prep should use a POD5 directory as input, not a single .pod5 file.
